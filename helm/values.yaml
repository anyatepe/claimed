# Default values for application
# This is a YAML-formatted file.

replicaCount: 2

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # We usually recommend not to specify default resources and to leave this as a comment
  # See https://kubernetes.io/docs/user-guide/compute-resources/
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetRPS: 100
  # Custom metrics API configuration
  # Requires metrics-server and custom metrics adapter (e.g., prometheus-adapter)
  customMetrics:
    enabled: true
    metricName: "http_requests_per_second"
    targetValue: "100"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Environment variables
env:
  # Vector backend configuration
  VECTOR_BACKEND: "pinecone"  # Options: pinecone, qdrant, weaviate, chroma
  # Model configuration
  MODEL_NAME: "text-embedding-ada-002"
  # Provider keys (will be stored in Secret)
  PROVIDER_API_KEY: ""  # Set via --set or from Secret

# ConfigMap data
configMap:
  enabled: true
  data: {}
    # Add any non-sensitive configuration here

# Secret data
secret:
  enabled: true
  # Values here will be base64 encoded automatically
  # For production, use --set-file or external secrets management
  data: {}
    # PROVIDER_API_KEY: ""  # Set via --set secret.data.PROVIDER_API_KEY="your-key"

nodeSelector: {}

tolerations: []

affinity: {}
